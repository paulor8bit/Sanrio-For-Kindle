name: Verificar e compilar SanrioKindle PT-BR
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar personagens, regras e interface
        run: |
          python -m pip install -r requirements-dev.txt
          python tests/test_sanrio.py
      - name: Preparar Zig 0.13.0
        run: |
          python - <<'PY'
          import hashlib,json,pathlib,tarfile,urllib.request
          data=json.load(urllib.request.urlopen('https://ziglang.org/download/index.json'))['0.13.0']['x86_64-linux']
          compiler=pathlib.Path('../sanrio-compiler');compiler.mkdir(exist_ok=True)
          source=compiler/'zig.tar.xz'
          urllib.request.urlretrieve(data['tarball'],source)
          assert hashlib.sha256(source.read_bytes()).hexdigest()==data['shasum']
          with tarfile.open(source) as archive: archive.extractall(compiler,filter='data')
          PY
      - name: Compilar KUAL para Kindle ARM
        run: |
          python tools/build_native.py --zig ../sanrio-compiler/zig-linux-x86_64-0.13.0/zig --deps ../sanrio-deps
          file native/build/sanriokindle
          if readelf -l native/build/sanriokindle | grep -q INTERP; then exit 1; fi
          sh -n native/kual/launch.sh
          sh -n native/kual/sleep-watch.sh
      - name: Verificar execução nativa
        run: |
          python tools/build_native.py --headless --zig ../sanrio-compiler/zig-linux-x86_64-0.13.0/zig --deps ../sanrio-deps
          cd native/build/extension
          ./sanriokindle-headless ../../../tests/test_native.lua native-test.pgm
      - name: Empacotar KUAL, KOReader, artes e fontes
        run: python tools/package_release.py --deps ../sanrio-deps
      - uses: actions/upload-artifact@v4
        with:
          name: SanrioKindle-PTBR-v0.1.0
          path: dist/*
          if-no-files-found: error
